# NetworkPolicy: 入站仅同 namespace + API-Gateway；出站允许 DNS/数据库/同 namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sm-fusion-platform.fullname" . }}
  labels:
    {{- include "sm-fusion-platform.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sm-fusion-platform.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
