name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: pytest tests -q
      - run: docker compose config --quiet
        env:
          FUSION_INTEGRATION_KEY: ci-only-integration-key-with-32-characters
          ERP_BOOTSTRAP_PASSWORD: ci-only-strong-bootstrap-password
          ERP_SM4_KEY_HEX: 00112233445566778899aabbccddeeff
