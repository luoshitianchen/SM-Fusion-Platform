name: Desktop Package Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build transparent source package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item desktop/main.py,desktop/start.ps1,desktop/requirements.txt,desktop/desktop-config.example.json,desktop/README.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/SM-Fusion-Platform-Desktop-Source.zip
          (Get-FileHash dist/SM-Fusion-Platform-Desktop-Source.zip -Algorithm SHA256).Hash + '  SM-Fusion-Platform-Desktop-Source.zip' | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SM-Fusion-Platform-desktop-source
          path: |
            dist/SM-Fusion-Platform-Desktop-Source.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SM-Fusion-Platform-Desktop-Source.zip
            dist/SHA256SUMS.txt
