name: Desktop Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SM-Fusion-Platform desktop/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SM-Fusion-Platform-windows
          path: dist/SM-Fusion-Platform.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SM-Fusion-Platform.exe
