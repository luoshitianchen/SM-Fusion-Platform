name: Desktop Package Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r desktop/requirements.txt pyinstaller==6.21.0
      - name: Build directory-mode Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name SM-Fusion-Platform desktop/main.py
          Copy-Item desktop/start.cmd,desktop/main.py,desktop/requirements.txt,desktop/desktop-config.example.json,desktop/README.md dist/SM-Fusion-Platform/
          Compress-Archive -Path dist/SM-Fusion-Platform/* -DestinationPath dist/SM-Fusion-Platform-Windows.zip
          (Get-FileHash dist/SM-Fusion-Platform-Windows.zip -Algorithm SHA256).Hash + '  SM-Fusion-Platform-Windows.zip' | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SM-Fusion-Platform-windows
          path: |
            dist/SM-Fusion-Platform-Windows.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SM-Fusion-Platform-Windows.zip
            dist/SHA256SUMS.txt
