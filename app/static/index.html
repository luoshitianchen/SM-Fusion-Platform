<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Fusion Platform</title><style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif;background:#07111f;color:#e8f0ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#12355b 0,transparent 35%),#07111f}.shell{max-width:1200px;margin:auto;padding:48px 24px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:14px;letter-spacing:.18em;color:#78aefc}.pill{border:1px solid #23466d;border-radius:99px;padding:8px 14px;color:#87d7bd}h1{font-size:48px;margin:56px 0 12px;max-width:760px}.lead{color:#9bb0ca;font-size:18px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:38px}.card{background:linear-gradient(145deg,#0d1d31,#0a1727);border:1px solid #193653;border-radius:18px;padding:26px;box-shadow:0 18px 45px #0005}.status{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:#9bb0ca}.dot{width:9px;height:9px;border-radius:50%;background:#d69b4e}.healthy .dot{background:#4ed6a3;box-shadow:0 0 12px #4ed6a3}.card h2{margin:22px 0 8px}.card p{color:#92a9c4;min-height:48px}a{display:inline-block;margin-top:12px;color:#fff;background:#1769e0;padding:10px 16px;border-radius:10px;text-decoration:none}.foot{margin-top:42px;color:#607894;font-size:13px}
</style></head><body><main class="shell"><div class="top"><div class="brand">SM · ENTERPRISE AI FABRIC</div><div class="pill" id="overall">正在检测服务</div></div><h1>多态融合企业智能平台</h1><p class="lead">统一编排 ERP 身份治理、企业知识库、RAG、多 Agent 与审计能力。各服务保持独立边界，通过受控接口协同。</p><section class="grid" id="services"></section><div class="foot">默认仅绑定本机回环地址 · 生产环境接入企业 VPN / 零信任网关</div></main><script>
async function load(){const box=document.querySelector('#services'),overall=document.querySelector('#overall');try{const data=await fetch('/api/services').then(r=>r.json());overall.textContent=`${data.healthy}/${data.total} 服务正常`;box.innerHTML=data.items.map(s=>`<article class="card ${s.status}"><div class="status"><i class="dot"></i>${s.status==='healthy'?'运行正常':'暂不可用'}</div><h2>${s.name}</h2><p>${s.description}</p><a href="${s.url}">进入系统</a></article>`).join('')}catch(e){overall.textContent='状态获取失败'}}load();setInterval(load,15000);
</script></body></html>
