<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Fusion Platform</title><style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif;background:#07111f;color:#e8f0ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#153e68 0,transparent 35%),#07111f}.shell{max-width:1240px;margin:auto;padding:30px 24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #193653;padding-bottom:18px}.brand{font-size:13px;letter-spacing:.18em;color:#78aefc}.pill{border:1px solid #23466d;border-radius:99px;padding:8px 14px;color:#87d7bd;font-size:13px}.hero{display:flex;justify-content:space-between;gap:30px;align-items:end;padding:42px 0 28px}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.05;margin:0 0 14px;max-width:760px}.lead{color:#9bb0ca;font-size:17px;line-height:1.75;max-width:700px;margin:0}.hero-meta{color:#6f87a3;font-size:13px;text-align:right;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:10px 0 28px}.metric,.panel{background:#0c1b2e;border:1px solid #193653;border-radius:14px;padding:18px}.metric small{display:block;color:#7790ac;font-size:12px}.metric strong{display:block;font-size:27px;margin-top:8px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-head h2{font-size:18px;margin:0}.refresh{color:#9bb0ca;background:transparent;border:1px solid #294a6d;padding:8px 12px;border-radius:9px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{background:linear-gradient(145deg,#0d1d31,#0a1727);border:1px solid #193653;border-radius:16px;padding:22px;box-shadow:0 16px 36px #0004}.status{display:flex;justify-content:space-between;align-items:center;color:#9bb0ca;font-size:13px}.state{display:inline-flex;gap:8px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#d69b4e}.healthy .dot{background:#4ed6a3;box-shadow:0 0 12px #4ed6a3}.card h3{margin:20px 0 8px;font-size:21px}.card p{color:#92a9c4;min-height:46px;line-height:1.6}.latency{color:#6f87a3;font-variant-numeric:tabular-nums}a{display:inline-block;margin-top:10px;color:#fff;background:#1769e0;padding:10px 15px;border-radius:9px;text-decoration:none}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.action{display:block;text-decoration:none;color:#dceaff;background:#102945;border:1px solid #214665;border-radius:12px;padding:16px}.action b{display:block;margin-bottom:6px}.action span{font-size:13px;color:#86a1bd}.foot{margin:36px 0 8px;color:#607894;font-size:13px}@media(max-width:700px){.hero{display:block}.hero-meta{text-align:left;margin-top:18px}.metrics{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}.shell{padding:22px 16px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">SM · ENTERPRISE AI FABRIC</div><div class="pill" id="overall">正在检测服务</div></header><section class="hero"><div><h1>多态融合企业智能平台</h1><p class="lead">统一编排 ERP 身份治理、企业知识库、RAG、多 Agent 与审计能力，让常用工作入口集中在一个企业工作台。</p></div><div class="hero-meta">平台版本 <b id="version">1.0.0</b><br><span id="updated">等待首次刷新</span></div></section><section class="metrics"><div class="metric"><small>服务总数</small><strong id="total">-</strong></div><div class="metric"><small>运行正常</small><strong id="healthy">-</strong></div><div class="metric"><small>整体可用率</small><strong id="availability">-</strong></div><div class="metric"><small>平均延迟</small><strong id="latency">-</strong></div></section><section><div class="section-head"><h2>企业服务中心</h2><button class="refresh" id="refresh">刷新状态</button></div><div class="grid" id="services"></div></section><section><div class="section-head"><h2>常用工作入口</h2></div><div class="actions"><a class="action" href="http://127.0.0.1:8100"><b>组织与身份管理</b><span>员工、部门、角色、审计</span></a><a class="action" href="http://127.0.0.1:8010"><b>企业知识问答</b><span>RAG、多轮会话、Agent</span></a><a class="action" href="http://127.0.0.1:8010/sources"><b>知识源同步</b><span>GitHub 文档导入与同步记录</span></a></div></section><div class="foot">默认仅绑定本机回环地址 · 生产环境接入企业 VPN / 零信任网关</div></main><script>
const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const d=await fetch('/api/overview',{cache:'no-store'}).then(r=>r.json());const good=d.healthy;$('#total').textContent=d.total;$('#healthy').textContent=good;$('#availability').textContent=`${Math.round(good/d.total*100)}%`;const ms=d.services.map(s=>s.latency_ms).reduce((a,b)=>a+b,0)/d.total;$('#latency').textContent=`${ms.toFixed(0)} ms`;$('#overall').textContent=`${good}/${d.total} 服务正常`;$(`#version`).textContent=d.platform.version;$('#updated').textContent=`最近刷新 ${new Date(d.refreshed_at*1000).toLocaleTimeString()}`;$('#services').innerHTML=d.services.map(s=>`<article class="card ${s.status}"><div class="status"><span class="state"><i class="dot"></i>${s.status==='healthy'?'运行正常':'暂不可用'}</span><span class="latency">${s.latency_ms} ms</span></div><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><a href="${esc(s.url)}">进入系统</a></article>`).join('')}catch(e){$('#overall').textContent='状态获取失败';$('#updated').textContent='请检查融合服务'}}$('#refresh').onclick=load;load();setInterval(load,15000);
</script></body></html>
