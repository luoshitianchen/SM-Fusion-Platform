<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Fusion Platform</title><style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif;background:#07111f;color:#e8f0ff}*{box-sizing:border-box}body{margin:0;background:#07111f}.shell{max-width:1320px;margin:auto;padding:28px 24px}.top,.section-head,.toolbar{display:flex;justify-content:space-between;align-items:center}.top{border-bottom:1px solid #193653;padding-bottom:18px}.brand{font-size:13px;letter-spacing:.18em;color:#78aefc}.pill{border:1px solid #23466d;border-radius:99px;padding:8px 14px;color:#87d7bd;font-size:13px}.hero{padding:38px 0 24px}.hero h1{font-size:42px;margin:0 0 12px}.lead{color:#9bb0ca;font-size:16px;line-height:1.7;max-width:760px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0 28px}.metric,.card{background:#0c1b2e;border:1px solid #193653;border-radius:12px;padding:17px}.metric small{display:block;color:#7790ac;font-size:12px}.metric strong{display:block;font-size:25px;margin-top:7px}.section-head{margin:25px 0 12px}.section-head h2{font-size:18px;margin:0}.toolbar{gap:10px}.search,select,button{background:#0b1a2d;border:1px solid #294a6d;color:#dceaff;border-radius:8px;padding:9px 12px}.search{width:250px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}.card{box-shadow:0 14px 32px #0003}.status{display:flex;justify-content:space-between;color:#91a6be;font-size:13px}.state{display:inline-flex;gap:8px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#e0a15d}.healthy .dot{background:#4ed6a3}.card h3{font-size:20px;margin:17px 0 7px}.card p{color:#92a9c4;line-height:1.55;min-height:45px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.meta span{background:#0a1727;border:1px solid #18334f;padding:8px;border-radius:7px;color:#8ea6c1;font-size:12px}.meta b{display:block;color:#d9e8fa;margin-top:4px;font-size:13px}.card a{display:inline-block;margin-top:14px;background:#1769e0;color:white;text-decoration:none;padding:9px 14px;border-radius:8px}.critical{color:#f08b77}.foot{margin:34px 0 8px;color:#607894;font-size:13px}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.shell{padding:20px 14px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">SM · ENTERPRISE SERVICE GOVERNANCE</div><div class="pill" id="overall">正在检测</div></header><section class="hero"><h1>企业服务治理中心</h1><p class="lead">面向企业应用负责人、平台工程和运维团队，统一查看项目健康、业务等级、SLO、责任归属与运行入口。</p></section><section class="metrics"><div class="metric"><small>服务总数</small><strong id="total">-</strong></div><div class="metric"><small>运行正常</small><strong id="healthy">-</strong></div><div class="metric"><small>整体可用率</small><strong id="availability">-</strong></div><div class="metric"><small>关键服务异常</small><strong id="critical">-</strong></div><div class="metric"><small>平均延迟</small><strong id="latency">-</strong></div></section><section><div class="section-head"><h2>项目目录</h2><div class="toolbar"><input id="search" class="search" placeholder="搜索项目、负责人、分类"><select id="state"><option value="all">全部状态</option><option value="healthy">运行正常</option><option value="unavailable">异常</option></select><button id="refresh">刷新</button></div></div><div class="grid" id="services"></div></section><div class="foot">平台版本 <span id="version">-</span> · 最近刷新 <span id="updated">-</span> · 生产环境通过企业 VPN / 零信任网关访问</div></main><script>
const $=s=>document.querySelector(s);let model=null;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){if(!model)return;const q=$('#search').value.trim().toLowerCase(),st=$('#state').value;const rows=model.services.filter(s=>(st==='all'||s.status===st)&&[s.name,s.owner,s.category,s.description].join(' ').toLowerCase().includes(q));$('#services').innerHTML=rows.map(s=>`<article class="card ${s.status}"><div class="status"><span class="state"><i class="dot"></i>${s.status==='healthy'?'运行正常':'服务异常'}</span><span>${s.latency_ms} ms</span></div><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><div class="meta"><span>责任团队<b>${esc(s.owner)}</b></span><span>业务等级<b>${esc(s.tier)}</b></span><span>SLO 目标<b>${s.slo}%</b></span><span>运行环境<b>${esc(s.environment)}</b></span></div><a href="${esc(s.url)}">进入系统</a></article>`).join('')||'<p class="lead">没有符合条件的项目。</p>'}async function load(){try{model=await fetch('/api/overview',{cache:'no-store'}).then(r=>r.json());const good=model.healthy,ms=model.services.reduce((a,s)=>a+s.latency_ms,0)/model.total;$('#total').textContent=model.total;$('#healthy').textContent=good;$('#availability').textContent=`${Math.round(good/model.total*100)}%`;$('#critical').textContent=model.critical_down;$('#critical').className=model.critical_down?'critical':'';$('#latency').textContent=`${ms.toFixed(0)} ms`;$('#overall').textContent=model.business_status==='operational'?'业务运行正常':model.business_status==='critical'?'关键业务异常':'部分服务降级';$('#version').textContent=model.platform.version;$('#updated').textContent=new Date(model.refreshed_at*1000).toLocaleTimeString();render()}catch(e){$('#overall').textContent='平台状态获取失败'}}$('#search').oninput=render;$('#state').onchange=render;$('#refresh').onclick=load;load();setInterval(load,15000);
</script></body></html>
