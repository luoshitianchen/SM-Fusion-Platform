apiVersion: v1
kind: Namespace
metadata:
  name: sm-enterprise
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sm-fusion-platform
  namespace: sm-enterprise
spec:
  replicas: 2
  selector:
    matchLabels: {app: sm-fusion-platform}
  template:
    metadata:
      labels: {app: sm-fusion-platform}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fusion
          image: ghcr.io/luoshitianchen/sm-fusion-platform:latest
          ports: [{containerPort: 8200}]
          readinessProbe: {httpGet: {path: /readyz, port: 8200}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8200}, periodSeconds: 20}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: sm-fusion-platform
  namespace: sm-enterprise
spec:
  selector: {app: sm-fusion-platform}
  ports: [{port: 8200, targetPort: 8200}]
