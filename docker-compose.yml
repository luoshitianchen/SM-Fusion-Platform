      SM_JWT_SECRET: ${SM_JWT_SECRET:?Set SM_JWT_SECRET in .env}
      SM_DATABASE_PATH: /app/data/iam.db
      SM_AUDIT_CENTER_URL: http://sm-audit-log-center:8320
      SM_IAM_BOOTSTRAP_USER: ${SM_IAM_BOOTSTRAP_USER:-admin}
      SM_IAM_BOOTSTRAP_PASSWORD: ${SM_IAM_BOOTSTRAP_PASSWORD:?Set SM_IAM_BOOTSTRAP_PASSWORD in .env}
