services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sm_enterprise}
      POSTGRES_USER: ${POSTGRES_USER:-sm_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 5}
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5}
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: ["qdrant-data:/qdrant/storage"]
    ports: ["127.0.0.1:${QDRANT_PORT:-6333}:6333"]
    restart: unless-stopped
  fusion-portal:
    build: .
    ports: ["${FUSION_BIND_ADDRESS:-127.0.0.1}:8200:8200"]
    environment:
      FUSION_SERVICE_CATALOG: /app/config/services.json
      DATABASE_URL: postgresql://${POSTGRES_USER:-sm_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sm_enterprise}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 100
volumes:
  postgres-data:
  redis-data:
  qdrant-data:
